<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyee Sanam 😜</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d9c2ff);
            overflow: hidden;
        }

        .box {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        #emoji {
            font-size: 80px;
            margin: 20px;
            transition: 0.3s;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 30px;
            background: #ff4f81;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
            min-height: 60px;
        }

        .floating {
            position: absolute;
            font-size: 30px;
            animation: float 6s linear infinite;
            opacity: 0.8;
        }

        @keyframes float {
            from {
                transform: translateY(100vh) rotate(0deg);
            }
            to {
                transform: translateY(-100px) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="floating" style="left:10%; animation-delay:0s;">😂</div>
    <div class="floating" style="left:25%; animation-delay:2s;">🤣</div>
    <div class="floating" style="left:45%; animation-delay:1s;">😜</div>
    <div class="floating" style="left:65%; animation-delay:3s;">🙈</div>
    <div class="floating" style="left:85%; animation-delay:1.5s;">✨</div>

    <div class="box">
        <h1>Oyee Sanam! 😂</h1>

        <div id="emoji">😐</div>

        <button onclick="showMessage()">
            Click Mat Karna 😂
        </button>

        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("emoji").innerHTML = "😂";

            document.getElementById("message").innerHTML =
                "Oyee pagal! 😂<br>" +
                "Mujhe pata hai Sanam,<br>" +
                "tum pagal ho! 😜";
        }
    </script>

</body>
</html>
